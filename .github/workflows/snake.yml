name: Update profile SVG

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/build_profile.py
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  build-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build directory
        run: mkdir -p build

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&disable_animations=true&hide_border=true&bg_color=0d1117&title_color=00e5a0&text_color=c9d1d9&icon_color=58a6ff
          path: build/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=5&hide_border=true&bg_color=0d1117&title_color=58a6ff&text_color=c9d1d9
          path: build/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: build/snake.svg?palette=github-dark

      - name: Compose profile SVG
        run: >-
          python scripts/build_profile.py
          --stats build/stats.svg
          --languages build/top-langs.svg
          --snake build/snake.svg
          --output profile/profile.svg

      - name: Commit unified profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/profile.svg
          git commit -m "Update profile SVG" || exit 0
          git push
